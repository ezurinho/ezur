[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ezur"
version = "0.1.0"
description = "Agnostic trading terminal: deterministic engine, pluggable strategy"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools]
packages = ["server", "server.strategy", "server.market"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Puerta mínima: lo que rompe el código (nombres indefinidos, claves duplicadas,
# sintaxis). El resto de familias (BLE, SIM, RUF...) se irá adoptando por
# archivo; meterlas de golpe obligaría a un refactor masivo sin pruebas detrás.
select = ["E4", "E7", "E9", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# `l` es el mínimo del OHLC en el contrato público (Bar y su esquema JSON).
"server/models.py" = ["E741"]
"server/schemas.py" = ["E741"]
# Los fixtures de pytest se importan y se inyectan por nombre: ruff lo lee como
# una redefinición del import.
"tests/test_traceability.py" = ["F811"]

[tool.coverage.run]
source = ["server"]
omit = ["server/strategy/null_strategy.py"]

[tool.coverage.report]
skip_covered = false
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise SystemExit"]
