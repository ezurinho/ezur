[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ezur"
version = "0.1.0"
description = "Agnostic trading terminal: deterministic engine, pluggable strategy"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["server", "server.strategy", "server.market"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["server"]
omit = ["server/strategy/null_strategy.py"]

[tool.coverage.report]
skip_covered = false
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise SystemExit"]
