name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check server tests research_engine installer run.py
      - run: python -m pytest --cov=server --cov-report=term --cov-fail-under=85
      # El motor de research trae sus propios tests (gates, fills maker): sin
      # este paso se ejecutaban solo cuando alguien se acordaba en local.
      - run: python -m pytest research_engine -q
      # Smoke test of the CLI path: it must produce a report and a verdict.
      - run: python -m server.simulation --days 2 --bars 60 --out /tmp/smoke.json --no-ledger
      - run: python -m server.funnel --ledger /tmp/missing.jsonl

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - run: npm run test

  workflows:
    # Un workflow roto no falla: simplemente no corre, y el verde del resto de
    # jobs tapa que esa mitad nunca se ejecuto. actionlint lo pone en rojo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2
  attribution:
    # El footer de Codebuff volvio una vez por accidente. Revisa los mensajes
    # que entran en la rama, no solo el ultimo: un merge o un rebase tambien
    # puede arrastrar el trailer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rechazar la atribucion a Codebuff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          tip="${HEAD_SHA:-HEAD}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            python scripts/check_attribution.py --rev "$tip"
          else
            python scripts/check_attribution.py --range "$BASE_SHA..$tip"
          fi
